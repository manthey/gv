init:
  # Build 64-bit.  The 32-bit build (vcvarsall amd64_x86) was retired when GV
  # was ported to 64 bits.
  - call "C:\\Program Files (x86)\\Microsoft Visual Studio 14.0\\VC\\vcvarsall.bat" amd64

build_script:
  - nmake
  - dir gv.exe gvlib.dll gvlib.lib mem.lib

artifacts:
  - path: gv.exe
  - path: gvlib.dll
  - path: gvlib.lib
  - path: gvlib.h
  - path: mem.lib
  - path: mem.h

deploy:
  - provider: GitHub
    tag: 'gv-latest'
    release: 'Release gv-latest'
    auth_token:
      secure: sH9xlvrR2D9eLJk/0iAJFV20bzughsiBC2BCWnzZunyMZodYDTcHa8DX+d8fYm7L
    artifact: gv.exe, gvlib.dll, gvlib.lib, gvlib.h, mem.lib, mem.h
    force_update: true
    on:
      branch: master

  - provider: GitHub
    tag: $(appveyor_repo_tag_name)
    release: Release $(appveyor_repo_tag_name)
    auth_token:
      secure: sH9xlvrR2D9eLJk/0iAJFV20bzughsiBC2BCWnzZunyMZodYDTcHa8DX+d8fYm7L
    artifact: gv.exe, gvlib.dll, gvlib.lib, gvlib.h, mem.lib, mem.h
    force_update: true
    on:
      appveyor_repo_tag: true
